<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated Pill Tab Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131313;
    --bar: #242424;
    --pill: #f2f2f2;
    --ink: #131313;
    --muted: #b0b0b0;
    --hover: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* Every dimension below is in em, so the whole bar scales from this one value.
     34px is the design size; 16.9em is the bar's widest state. */
  .tabbar {
    font-size: min(34px, calc((100vw - 32px) / 17));
    position: relative;
    display: inline-flex;
    align-items: center;
    padding: .265em;
    border-radius: 999px;
    background: var(--bar);
    user-select: none;
    -webkit-user-select: none;
  }

  .tabbar__pill {
    position: absolute;
    top: .265em;
    left: 0;
    height: 2.706em;
    width: 0;
    border-radius: 999px;
    background: var(--pill);
    will-change: transform, width;
    pointer-events: none;
  }

  .tab {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    height: 2.706em;
    padding: 0 .97em;
    margin: 0;
    border: 0;
    border-radius: 999px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: color .15s ease;
  }

  .tab:hover { color: var(--hover); }
  .tab.is-active { color: var(--ink); }

  .tab:focus-visible { box-shadow: 0 0 0 .06em var(--bar), 0 0 0 .14em var(--hover); }

  /* Icon: outline and solid versions stacked, crossfaded on activation */
  .tab__icon {
    position: relative;
    flex: none;
    width: 1.176em;
    height: 1.176em;
  }

  .tab__icon svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: opacity .12s ease;
  }

  .tab__icon .solid { fill: currentColor; opacity: 0; }
  .tab.is-active .tab__icon .solid { opacity: 1; }
  .tab.is-active .tab__icon .line { opacity: 0; }

  .tab__badge {
    position: absolute;
    top: 50%;
    left: 50%;
    display: grid;
    place-items: center;
    width: 1.773em;
    height: 1.773em;
    font-size: .647em;
    border-radius: 50%;
    background: var(--pill);
    color: var(--ink);
    box-shadow: 0 0 0 .16em var(--bar);
    transform: translate(calc(-50% + 1.18em), calc(-50% - .773em));
    transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
  }

  .tab.is-active .tab__badge {
    background: var(--ink);
    color: var(--pill);
    box-shadow: 0 0 0 .16em var(--pill);
  }

  /* Label: the grid track animates 0fr -> 1fr so the tab grows to its natural width */
  .tab__label {
    display: grid;
    grid-template-columns: 0fr;
    opacity: 0;
    transition: grid-template-columns .26s cubic-bezier(.4, 0, .2, 1), opacity .08s linear;
  }

  .tab__label > span {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    /* keep descenders/ascenders from being clipped by overflow */
    padding-block: .3em;
  }

  /* icon-to-label gap lives inside the clipped box so it collapses with it */
  .tab__label > span::before {
    content: "";
    display: inline-block;
    width: .588em;
  }

  /* the badge overhangs the icon, so its label needs more room */
  .tab--badged .tab__label > span::before { width: .94em; }

  .tab.is-active .tab__label {
    grid-template-columns: 1fr;
    opacity: 1;
    transition: grid-template-columns .26s cubic-bezier(.4, 0, .2, 1), opacity .28s ease .22s;
  }

  @media (prefers-reduced-motion: reduce) {
    .tab, .tab__icon svg, .tab__badge, .tab__label, .tab.is-active .tab__label { transition: none; }
  }
</style>
</head>
<body>

<nav class="tabbar" aria-label="Primary">
  <span class="tabbar__pill" aria-hidden="true"></span>

  <button class="tab is-active" type="button" aria-current="page" aria-label="Home">
    <span class="tab__icon">
      <svg class="line" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      <svg class="solid" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
    </span>
    <span class="tab__label"><span>Home</span></span>
  </button>

  <button class="tab" type="button" aria-label="Saved">
    <span class="tab__icon">
      <svg class="line" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
      </svg>
      <svg class="solid" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
      </svg>
    </span>
    <span class="tab__label"><span>Saved</span></span>
  </button>

  <button class="tab tab--badged" type="button" aria-label="Inbox, 2 unread">
    <span class="tab__icon">
      <svg class="line" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
      </svg>
      <svg class="solid" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
      </svg>
      <span class="tab__badge" aria-hidden="true">2</span>
    </span>
    <span class="tab__label"><span>Inbox</span></span>
  </button>

  <button class="tab" type="button" aria-label="Profile">
    <span class="tab__icon">
      <svg class="line" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <svg class="solid" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2z"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </span>
    <span class="tab__label"><span>Profile</span></span>
  </button>
</nav>

<script>
(function () {
  var bar = document.querySelector('.tabbar');
  var pill = bar.querySelector('.tabbar__pill');
  var tabs = Array.prototype.slice.call(bar.querySelectorAll('.tab'));
  var active = bar.querySelector('.tab.is-active') || tabs[0];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Spring that chases the active tab's live box while the layout transitions.
  var STIFFNESS = 420, DAMPING = 34;
  var TRAVEL_MS = 170;   // pill stays icon-sized this long while it travels
  var SETTLE_MS = 900;   // layout transitions are long done by now

  var x = 0, w = 0, vx = 0, vw = 0;
  var switchedAt = -Infinity, lastTime = 0, raf = 0;

  function collapsedWidth() {
    // width of a tab with no label: horizontal padding + icon
    var cs = getComputedStyle(active);
    var icon = active.querySelector('.tab__icon');
    return parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + icon.offsetWidth;
  }

  function target(now) {
    var travelling = now - switchedAt < TRAVEL_MS;
    return { x: active.offsetLeft, w: travelling ? collapsedWidth() : active.offsetWidth };
  }

  function render() {
    pill.style.transform = 'translate3d(' + x + 'px,0,0)';
    pill.style.width = w + 'px';
  }

  function snap() {
    cancelAnimationFrame(raf);
    raf = 0;
    switchedAt = -Infinity;
    x = active.offsetLeft;
    w = active.offsetWidth;
    vx = vw = 0;
    render();
  }

  function tick(now) {
    var dt = Math.min((now - lastTime) / 1000, 1 / 30);
    lastTime = now;
    var t = target(now);

    // fixed sub-steps keep the spring stable on slow frames
    var steps = Math.max(1, Math.ceil(dt / 0.004)), h = dt / steps;
    for (var i = 0; i < steps; i++) {
      vx += (STIFFNESS * (t.x - x) - DAMPING * vx) * h;
      vw += (STIFFNESS * (t.w - w) - DAMPING * vw) * h;
      x += vx * h;
      w += vw * h;
    }
    if (w < 0) w = 0;
    render();

    var resting = Math.abs(t.x - x) < 0.1 && Math.abs(t.w - w) < 0.1 &&
                  Math.abs(vx) < 1 && Math.abs(vw) < 1;
    if (resting && now - switchedAt > SETTLE_MS) {
      snap();
    } else {
      raf = requestAnimationFrame(tick);
    }
  }

  function select(tab) {
    if (tab === active) return;
    active.classList.remove('is-active');
    active.removeAttribute('aria-current');
    active = tab;
    active.classList.add('is-active');
    active.setAttribute('aria-current', 'page');

    if (reduceMotion.matches) { snap(); return; }

    switchedAt = performance.now();
    if (!raf) {
      lastTime = switchedAt;
      raf = requestAnimationFrame(tick);
    }
  }

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () { select(tab); });
  });

  window.addEventListener('resize', snap);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!raf) snap(); });
  snap();
})();
</script>
</body>
</html>
